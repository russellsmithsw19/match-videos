<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   EDIT THIS SECTION ONLY
   ---------------------------------------------------------------------
   1. Put your video files in a folder called "videos" next to this file.
   2. Add one entry per clip below, in the order you want them shown.
      - file:  the video's file name inside the videos folder
      - title: the clip's heading
      - note:  your commentary (use \n for a new line)
   3. Keep the commas between entries. Don't use a plain " inside a
      note; write \" instead, or use ' (apostrophe) freely.
   ===================================================================== */
const PAGE_TITLE = "Video Feedback    7Wells vs Horsham/Crowborough/Haywards Heath    20/09/26";
const PAGE_INTRO = "Watch each clip and read the coach's notes underneath.";

const CLIPS = [
  {
    file: "Penalty-choice-near-the-touchline.mp4",
    title: "Penalty choices",
    note: "We're near a touchline here. What other decision could we have made at this position?"
  },
  {
    file: "our-kick-off-space-behind.mp4",
    title: "Pitch positioning",
    note: "Let's have a think about our postioning - if Horsham had kicked straight back, what would have happend? How would we have organised ourselves? What could we have done better?"
  },
  {
    file: "Attacking-ruck-well-executed.mp4",
    title: "Excellent defensive ruck forcing an error from the oppo",
    note: "See how some agression really works well? and look at the dancing feet ready for a tackle - good work!"
  },
  {
    file: "Zara-bosh-try.mp4",
    title: "Straight and direct works too",
    note: "Get your body positon right if going into contact - low and strong stance can repel defenders"
  },
  {
    file: "Short-Scarlett-kick-off.mp4",
    title: "Short kick off and chase",
    note: "This is excellent work - look for a gap and chase it hard, win the ball"
  },
  {
    file: "Mary-nearly-try.mp4",
    title: "Wonderful defensive chop tackle",
    note: "Unfortunately didnt make it but it was an excellent cover tackle. The defender 'corner flagged'. What else could we have done to score that try? "
  },
  {
    file: "crowbrgh-kick-chase-deep-defense-needed.mp4",
    title: "Crowborough kick and chase",
    note: "This is more than kick and hope - the team followed up at speed and gained a lot of ground. Be careful not to do it too much or the opposition will expect it."
  },
  {
    file: "Maya-offload-out-tackle.mp4",
    title: "May offload from the tackle",
    note: "Great work - look up and spot your supporting runner. Scarlett made herself known too (vocal!) Make sure the oppositon are 'fixed' then pass"
  },
  {
    file: "crowbrgh-multi-kick-chase.mp4",
    title: "Chip, punt, chase, try",
    note: "Lovely work from Crowborough - make the most of such opportunities, but its safest to keep the ball in hand. How would you defend against this?"
  },
  {
    file: "scarlett-harassing-and-emilia-offload.mp4",
    title: "Scarlett harassing, Emilia offload",
    note: "Some great skills here!"
  },
  {
    file: "Eva-being-strong-and-safe.mp4",
    title: "Eva strong and safe, Nella securing",
    note: "Really good work from strong Eva, excellent presentation, great gorilla from Nella"
  },
  {
    file: "Rosie-run-then-Sydney-try.mp4",
    title: "Great run as usual from Rosie - then excellent run from depth from Sydney. take it at pace - its hard to stop!",
    note: ""
  },
  {
    file: "Sydney.mp4",
    title: "Fantastic kick, straighter next time!",
    note: ""
  },
  {
    file: "Sydney-2.mp4",
    title: "Fantastic kick, that's better!",
    note: ""
  },
  {
    file: "Mary-long-try.mp4",
    title: "Long range try from Mary",
    note: "Excellent work.  And lots of suport runners too in case of trouble - excellent work all round!  The run against the flow of play is what started it off. "
  },
  {
    file: "maya-tackle.mp4",
    title: "Maya tackle on the wing",
    note: "The tackle happened, but a safer method would have been to use a shoulder, ring of steel and pull down that way - but great work!"
  },
  {
    file: "Lottie.mp4",
    title: "Support runners?",
    note: "Strong run from Lottie, but it would have been great for team mates to provide other threats, running to the left on the switch."
  },
  {
    file: "Maisie-Mary-try.mp4",
    title: "speedy Maisie!",
    note: "Great run from Maisie, nealry got there, but set it up well for others to score! "
  },
  {
    file: "Zara-on-switch-offload.mp4",
    title: "Nice switch!",
    note: "A planned move which caught the oppo on the hop. Z could have gone more directly and looked left for Maisie for a certian try! Let's practice this."
  }

];
/* ===================================================================== */
</script>

<style>
:root{
  --pitch:#1d4a33; --ink:#17201b; --muted:#5b6a60; --line:#d6dccf;
  --card:#ffffff; --flag:#c42f3a; --bg:#eef1ea; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--ink:#e8ede4; --muted:#9aab9f; --line:#2c3b31; --card:#18221c; --bg:#0f1712; --pitch:#1f5238; color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

.head{background:var(--pitch);color:#f4f5ef;position:relative;overflow:hidden}
.head::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,transparent calc(22% - 1px),rgba(255,255,255,.22) calc(22% - 1px),rgba(255,255,255,.22) calc(22% + 1px),transparent calc(22% + 1px)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 60px,transparent 60px 120px)}
.head-in{position:relative;max-width:1100px;margin:0 auto;padding:28px 20px 26px}
.head h1{font:800 clamp(2.4rem,7vw,4.2rem)/.92 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;white-space:pre-wrap}
.head p{margin:10px 0 0;max-width:60ch;color:#cfe0d4}

.wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr}}

.player{background:#000;border-radius:6px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.player video{width:100%;height:100%;display:block;background:#000}
.player .empty{color:#b8c4bb;padding:24px;text-align:center}

.now h2{font:800 1.9rem/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:14px 0 8px}
.note-by{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.note{border-left:4px solid var(--flag);padding:4px 0 4px 14px;white-space:pre-wrap;max-width:65ch}

.list h3{font:600 1.25rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 10px;color:var(--muted)}
.clips{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.clip{border-bottom:1px solid var(--line)}
.clip button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr;gap:10px;width:100%;padding:12px 6px;align-items:baseline}
.clip button:focus-visible{outline:3px solid var(--flag)}
.clip .num{font:800 1.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.clip .t{font-weight:600}
.clip .s{display:block;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip.on{background:var(--card)}
.clip.on .num{color:var(--flag)}
</style>
</head>
<body>
<header class="head"><div class="head-in">
  <h1 id="pageTitle"></h1>
  <p id="pageSub"></p>
</div></header>

<main class="wrap">
  <section class="stage">
    <div class="now">
      <div class="player" id="player"></div>
      <h2 id="nowTitle"></h2>
      <p class="note-by" id="noteBy" hidden>Coach's notes</p>
      <div class="note" id="nowNote" hidden></div>
    </div>
    <aside class="list">
      <h3>All clips</h3>
      <ul class="clips" id="clips"></ul>
    </aside>
  </section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  $("pageTitle").textContent = PAGE_TITLE;
  $("pageSub").textContent = PAGE_INTRO;
  document.title = PAGE_TITLE;

  // Allow linking straight to a clip, e.g. index.html#3
  let current = Math.max(0, Math.min(CLIPS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));

  function show(){
    const p = $("player"); p.innerHTML = "";
    const c = CLIPS[current];
    if (!c){
      p.innerHTML = '<div class="empty">No clips have been posted yet.</div>';
      return;
    }
    const v = document.createElement("video");
    v.controls = true; v.playsInline = true; v.preload = "metadata";
    v.setAttribute("playsinline", "");
    v.src = "videos/" + encodeURIComponent(c.file);
    let triedRoot = false;
    v.onerror = () => {
      if (!triedRoot) { triedRoot = true; v.src = encodeURIComponent(c.file); return; }
      p.innerHTML = '<div class="empty">This video could not be loaded. Check that "' + c.file.replace(/</g,"&lt;") + '" is uploaded, and that the name matches exactly, including capital letters.</div>';
    };
    p.appendChild(v);
    $("nowTitle").textContent = c.title || "Untitled clip";
    const has = !!(c.note && c.note.trim());
    $("nowNote").textContent = c.note || "";
    $("nowNote").hidden = !has; $("noteBy").hidden = !has;

    const ul = $("clips"); ul.innerHTML = "";
    CLIPS.forEach((x, i) => {
      const li = document.createElement("li");
      li.className = "clip" + (i === current ? " on" : "");
      const b = document.createElement("button");
      const n = document.createElement("span"); n.className = "num"; n.textContent = i + 1;
      const t = document.createElement("span"); t.className = "t"; t.textContent = x.title || "Untitled clip";
      const s = document.createElement("span"); s.className = "s"; s.textContent = (x.note || "").split("\n")[0];
      t.appendChild(s); b.append(n, t);
      b.onclick = () => {
        current = i; history.replaceState(null, "", "#" + (i + 1)); show();
        if (window.innerWidth < 820) $("player").scrollIntoView({behavior: "smooth", block: "start"});
      };
      li.appendChild(b); ul.appendChild(li);
    });
  }
  show();
})();
</script>
</body>
</html>
